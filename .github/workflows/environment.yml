---
name: Development environment

on:
  pull_request:
    paths:
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/environment.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'uv.toml'
  push:
    branches: [main]
    paths:
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/environment.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'uv.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Development tools on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install development tools
        uses: jdx/mise-action@v5

      - name: Verify tool versions
        run: mise run versions

      - name: Install locked project dependencies
        run: mise run setup
