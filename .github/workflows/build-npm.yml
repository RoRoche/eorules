---
name: Node.js CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint branch name and Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Detect Markdown and lint configuration changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            markdown:
              - '**/*.md'
              - '.markdownlint*'
              - '.textlint*'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/build-npm.yml'

      - name: Install development tools
        uses: jdx/mise-action@v5
        with:
          install_args: node npm

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('mise.toml', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint branch name
        run: mise run lint:branch

      - name: Lint Markdown
        if: ${{ steps.changes.outputs.markdown == 'true' }}
        run: mise run lint:markdown
